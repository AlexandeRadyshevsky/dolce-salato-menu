# /etc/nginx/sites-available/dolcesalato.ru
server {
    listen 80;
    server_name dolcesalato.ru www.dolcesalato.ru;
    return 301 https://dolcesalato.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dolcesalato.ru;
    # ssl_certificate / ssl_certificate_key — certbot --nginx

    root /var/www/dolcesalato/dist;
    index index.html;

    # Точные совпадения раньше общего правила для /katalog/.
    include /var/www/dolcesalato/dist/_redirects.nginx;

    location = /katalog { return 301 /catalog/$is_args$args; }
    location = /katalog/ { return 301 /catalog/$is_args$args; }
    location ~ ^/katalog/(.+?)/?$ { return 301 /catalog/$1/$is_args$args; }

    # админка заявок (отдаёт API-сервер, в статике её нет)
    location = /admin {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # API формы «Запросить прайс-лист»
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 32k;
    }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /images/ { expires 30d; }

    # статические ЧПУ-страницы (catalog/<категория>/<товар>-optom/index.html)
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
